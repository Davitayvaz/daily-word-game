<!DOCTYPE html>
<html>
<head>
  <title>Daily Word</title>
  <script src="words.js"></script>
  <script src="game.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
    }
    .letter {
      display: inline-block;
      width: 40px;
      height: 40px;
      line-height: 40px;
      border: 2px solid #333;
      margin: 2px;
      font-size: 20px;
      text-transform: uppercase;
    }
    .correct { background: green; color: white; }
    .present { background: gold; color: white; }
    .absent { background: #bbb; color: white; }
    input {
      font-size: 18px;
      padding: 6px;
      width: 260px;
      text-transform: uppercase;
    }
    button {
      font-size: 16px;
      padding: 6px 10px;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <h1>Daily Word 💙</h1>
  <p id="wordLength"></p>

  <div id="board"></div>

  <input id="guessInput" placeholder="Type your guess">
  <button id="submitGuess">Guess</button>

</body>
</html>
